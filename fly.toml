# fly.toml app configuration file generated for trucking on 2026-08-21T01:08:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trucking'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # ONE machine (audit F-013, 2026-11-20): some guards are in-process memory - the position-feed
  # rate limit (services/fleet/device-feed.ts), the auto-rest retry throttle and the rest question
  # fallback (services/telegram/live-location.ts). Before running more than one machine, move them
  # to the database, or each machine keeps its own copy.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
