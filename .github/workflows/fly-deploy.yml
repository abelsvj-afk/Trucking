# Deploys to Fly.io on every push to main.
#
# Why this exists: the owner works from a phone and has no local clone,
# no terminal, and no flyctl - so `fly deploy` was simply never runnable,
# which is why the live app sat at the original scaffold image while main
# advanced ~30 commits ahead of it. CI is the only deploy path that
# actually works for this project's real operating conditions, so it's
# the supported one, not a convenience.
#
# Requires one GitHub repository secret: FLY_API_TOKEN (see
# docs/runtime.md's Deployment section for how to create it - both steps
# are web UIs, doable from a phone).

name: Fly Deploy

on:
  push:
    branches:
      - main
  # Lets the owner re-run a deploy from the GitHub Actions web UI without
  # pushing a commit - the phone-accessible equivalent of `fly deploy`.
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same checks CLAUDE.md's verification discipline requires
      # before any change is considered done. Deliberately NOT running
      # `next build` here - flyctl builds the real image during deploy,
      # so a second build would just be slower duplication. Typecheck,
      # lint, and unit tests need no environment configuration, so they
      # run cleanly in CI without any secrets.
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run tests/unit

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    # Never let two deploys race each other onto the same app.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
